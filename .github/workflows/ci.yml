name: Loan Prediction Ci
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout respository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with: 
          python-version: "3.12"
      - name: Check python version
        run: python --version
      - name: Install dependencies
        run: pip install -r requirements.txt 
      - name: application validation
        run: python -c "from app.main import app"
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}
      - name: Build docker image
        run: docker build -t mohith1503/predict-loan:latest .
      - name: push docker image
        run: docker push mohith1503/predict-loan:latest
      - name: deploy to ec2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.EC2_HOST}}
          username: ${{secrets.EC2_USERNAME}}
          key: ${{secrets.EC2_KEY}}
          script: |
            docker pull mohith1503/predict-loan:latest
            docker stop predict-loan || true
            docker rm predict-loan ||true
            docker run -d --name predict-loan -p 8000:8000 mohith1503/predict-loan:latest